# One runner container with every native client (see Dockerfile). The checkout
# is mounted at /suite, so code and config changes need no image rebuild.
name: aut

services:
  runner:
    image: ${AUT_IMAGE:-ghcr.io/maxpschonder/artifactory-upgrade-tests:latest}
    build: .
    pull_policy: missing
    working_dir: /suite
    volumes:
      - .:/suite
      - m2:/root/.m2
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      ARTIFACTORY_URL: ${ARTIFACTORY_URL:-}
      ARTIFACTORY_TOKEN: ${ARTIFACTORY_TOKEN:-}
      ARTIFACTORY_USER: ${ARTIFACTORY_USER:-}
      ARTIFACTORY_ADMIN_USER: ${ARTIFACTORY_ADMIN_USER:-admin}
      ARTIFACTORY_ADMIN_PASSWORD: ${ARTIFACTORY_ADMIN_PASSWORD:-password}
      AUT_CONFIG: ${AUT_CONFIG:-config.yaml}
      AUT_FORMATS: ${AUT_FORMATS:-}
      # Reserved for instances behind an HTTP proxy; forwarded as-is for now.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

volumes:
  m2:
